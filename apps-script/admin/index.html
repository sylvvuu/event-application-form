<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신청자 현황</title>
<style>
  :root {
    --bg: #f3f6fb; --card: #fff; --line: #e3e8f0; --text: #1f2a3d; --sub: #6b7689;
    --primary: #3b7ddd; --primary-soft: #e8f0fc;
    --s1: #3b7ddd; --s1-bg: #e8f0fc;   /* 접수완료 */
    --s2: #c77700; --s2-bg: #fff4e0;   /* 확인중 */
    --s3: #2f9e44; --s3-bg: #e6f6ea;   /* 연락완료 */
    --s4: #868e96; --s4-bg: #f1f3f5;   /* 취소 */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 14px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }

  /* 헤더 */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-bottom: 18px; }
  header h1 { margin: 0; font-size: 24px; flex: 1 1 auto; }
  header h1 small { display: block; font-size: 13px; font-weight: normal; color: var(--sub); margin-top: 4px; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 8px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: #f8f9fb; }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* 통계 카드 (누르면 해당 상태로 필터) */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    cursor: pointer; text-align: left; font-family: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .stat:hover { border-color: #c5d3ea; }
  .stat.on { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .stat span { display: block; font-size: 12px; color: var(--sub); }
  .stat strong { display: block; font-size: 26px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  /* 필터 바 */
  .filters { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr auto; gap: 8px; margin-bottom: 12px; }
  .filters label { display: block; font-size: 11px; color: var(--sub); margin: 0 0 4px 2px; }
  .filters input, .filters select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--text); }
  .filters input:focus, .filters select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .filters .reset { align-self: end; }

  .resultbar { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 10px; color: var(--sub); font-size: 13px; }
  .resultbar b { color: var(--text); }
  .notice { font-size: 12px; color: var(--sub); }

  /* 표 (PC) */
  .tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid #eef1f6; vertical-align: top; }
  th { background: #f8f9fb; font-size: 12px; color: var(--sub); font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none; }
  th.nosort { cursor: default; }
  th .arrow { color: var(--primary); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafcff; }
  td.mono { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.id { color: var(--sub); font-size: 12px; }
  td.msg { max-width: 260px; color: #444; word-break: break-word; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .b-접수완료 { color: var(--s1); background: var(--s1-bg); }
  .b-확인중 { color: var(--s2); background: var(--s2-bg); }
  .b-연락완료 { color: var(--s3); background: var(--s3-bg); }
  .b-취소 { color: var(--s4); background: var(--s4-bg); }
  mark { background: #fff3a3; color: inherit; padding: 0 1px; border-radius: 2px; }

  /* 카드 (모바일) */
  .cards { display: none; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item .name { font-size: 16px; font-weight: 700; }
  .item .org { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .item dl { display: grid; grid-template-columns: 70px 1fr; gap: 4px 8px; margin: 10px 0 0; font-size: 13px; }
  .item dt { color: var(--sub); }
  .item dd { margin: 0; word-break: break-all; }
  .item .msg { margin-top: 10px; padding: 10px; background: #f8f9fb; border-radius: 8px; font-size: 13px; color: #444; }

  .empty, .loading { padding: 48px 16px; text-align: center; color: var(--sub); }
  .error { padding: 16px; background: #fff5f5; border: 1px solid #ffc9c9; color: #c92a2a; border-radius: 12px; }

  /* 페이지 */
  .pager { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .pager button { min-width: 36px; height: 36px; border: 1px solid var(--line); background: #fff; border-radius: 8px;
    cursor: pointer; font-family: inherit; font-size: 14px; color: var(--text); }
  .pager button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pager button:disabled { opacity: .4; cursor: default; }

  /* 반응형 */
  @media (max-width: 1000px) {
    .filters { grid-template-columns: 1fr 1fr 1fr; }
    .filters .search { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 16px 12px 40px; }
    header h1 { font-size: 20px; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat { padding: 10px; }
    .stat strong { font-size: 20px; }
    .filters { grid-template-columns: 1fr 1fr; padding: 12px; }
    .filters .reset { grid-column: 1 / -1; }
    .tablewrap { display: none; }
    .cards { display: block; }
  }
  @media (max-width: 380px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>신청자 현황<small id="updated">불러오는 중…</small></h1>
    <button class="btn" id="refresh">새로고침</button>
  </header>

  <section class="stats" id="stats"></section>

  <section class="filters">
    <div class="search">
      <label for="q">검색</label>
      <input type="search" id="q" placeholder="이름·휴대폰·이메일·소속·질문 (이름은 2글자 이상)">
    </div>
    <div>
      <label for="status">진행상태</label>
      <select id="status"><option value="">전체</option></select>
    </div>
    <div>
      <label for="org">소속</label>
      <select id="org"><option value="">전체</option></select>
    </div>
    <div>
      <label for="from">시작일</label>
      <input type="date" id="from">
    </div>
    <div>
      <label for="to">종료일</label>
      <input type="date" id="to">
    </div>
    <div>
      <label for="msgOnly">질문 여부</label>
      <select id="msgOnly">
        <option value="">전체</option>
        <option value="y">질문 있음</option>
        <option value="n">질문 없음</option>
      </select>
    </div>
    <button class="btn reset" id="reset">초기화</button>
  </section>

  <div class="resultbar">
    <div>검색 결과 <b id="count">0</b>건</div>
    <div class="notice">개인정보 보호를 위해 이름·연락처는 가려서 표시돼요</div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th data-sort="date">접수일시 <span class="arrow"></span></th>
          <th data-sort="id">접수번호 <span class="arrow"></span></th>
          <th data-sort="name">이름 <span class="arrow"></span></th>
          <th data-sort="org">소속 <span class="arrow"></span></th>
          <th class="nosort">이메일</th>
          <th class="nosort">휴대폰</th>
          <th data-sort="status">진행상태 <span class="arrow"></span></th>
          <th class="nosort">질문 및 요청사항</th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="8" class="loading">데이터를 불러오는 중이에요…</td></tr></tbody>
    </table>
  </div>
  <div class="cards" id="cards"><div class="loading">데이터를 불러오는 중이에요…</div></div>

  <nav class="pager" id="pager"></nav>
</div>

<script>
  var STATUS = ['접수완료', '확인중', '연락완료', '취소'];
  var COLORS = { '접수완료': 'var(--s1)', '확인중': 'var(--s2)', '연락완료': 'var(--s3)', '취소': 'var(--s4)' };
  var PAGE_SIZE = 20;
  var all = [], view = [], page = 1, sortKey = 'date', sortDir = -1;
  var $ = function (id) { return document.getElementById(id); };

  // ---------- 데이터 불러오기 ----------
  // 검색어가 있으면 서버에서 원본 이름·연락처로 찾아서 결과만 받아옴
  var reqNo = 0, optionsBuilt = false;
  function load() {
    var q = $('q').value.trim(), my = ++reqNo;
    $('updated').textContent = q ? '"' + q + '" 검색 중…' : '불러오는 중…';
    google.script.run
      .withSuccessHandler(function (res) {
        if (my !== reqNo) return; // 늦게 도착한 예전 검색 결과는 무시
        all = res.rows.map(function (r) { r.day = toDay(r.date); return r; });
        $('updated').textContent = '마지막 업데이트 ' + res.updatedAt + ' · 전체 ' + res.total + '건';
        if (!q || !optionsBuilt) { buildOptions(); optionsBuilt = !q; }
        apply();
      })
      .withFailureHandler(function (err) {
        var box = '<div class="error">데이터를 불러오지 못했어요: ' + esc(err.message || err) + '</div>';
        $('tbody').innerHTML = '<tr><td colspan="8">' + box + '</td></tr>';
        $('cards').innerHTML = box;
        $('updated').textContent = '불러오기 실패';
      })
      .getData(q);
  }

  // "2026-11-06 13:36:40" 또는 "2026. 11. 6. 오후 1:36:40" → "2026-11-06"
  function toDay(s) {
    var m = String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    return m ? m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2) : '';
  }
  // 정렬용 시각 값
  function toTime(s) {
    var m = String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})\D+(오전|오후)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if (!m) return 0;
    var h = +m[5]; if (m[4] === '오후' && h < 12) h += 12; if (m[4] === '오전' && h === 12) h = 0;
    return new Date(+m[1], +m[2] - 1, +m[3], h, +m[6], +(m[7] || 0)).getTime();
  }

  function buildOptions() {
    var st = $('status'), og = $('org'), keepSt = st.value, keepOg = og.value;
    st.innerHTML = '<option value="">전체</option>' + STATUS.map(function (s) { return '<option>' + s + '</option>'; }).join('');
    var orgs = {}; all.forEach(function (r) { orgs[r.org] = (orgs[r.org] || 0) + 1; });
    og.innerHTML = '<option value="">전체</option>' + Object.keys(orgs).sort().map(function (o) {
      return '<option value="' + esc(o) + '">' + esc(o) + ' (' + orgs[o] + ')</option>';
    }).join('');
    st.value = keepSt; og.value = keepOg;
  }

  // ---------- 필터 + 정렬 ----------
  function apply() {
    var st = $('status').value, og = $('org').value,
        from = $('from').value, to = $('to').value, mo = $('msgOnly').value;
    view = all.filter(function (r) {
      if (st && r.status !== st) return false;
      if (og && r.org !== og) return false;
      if (from && r.day < from) return false;
      if (to && r.day > to) return false;
      if (mo === 'y' && !r.message) return false;
      if (mo === 'n' && r.message) return false;
      return true;
    });
    view.sort(function (a, b) {
      var x = sortKey === 'date' ? toTime(a.date) : String(a[sortKey]);
      var y = sortKey === 'date' ? toTime(b.date) : String(b[sortKey]);
      return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
    });
    page = 1;
    renderStats(); render();
  }

  function renderStats() {
    // 통계는 상태 필터를 뺀 나머지 조건 기준으로 계산
    var st = $('status').value;
    var base = all;
    var cnt = { '': base.length }; STATUS.forEach(function (s) { cnt[s] = 0; });
    base.forEach(function (r) { if (cnt[r.status] !== undefined) cnt[r.status]++; });
    var items = [['', '전체', 'var(--text)']].concat(STATUS.map(function (s) { return [s, s, COLORS[s]]; }));
    $('stats').innerHTML = items.map(function (it) {
      return '<button class="stat' + (st === it[0] ? ' on' : '') + '" data-status="' + it[0] + '">' +
        '<span><i class="dot" style="background:' + it[2] + '"></i>' + it[1] + '</span><strong>' + cnt[it[0]] + '</strong></button>';
    }).join('');
  }

  // ---------- 화면 그리기 ----------
  function render() {
    $('count').textContent = view.length;
    var pages = Math.max(1, Math.ceil(view.length / PAGE_SIZE));
    if (page > pages) page = pages;
    var list = view.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
    var q = $('q').value.trim();

    if (!list.length) {
      var msg = q.length === 1 ? '이름·연락처는 2글자 이상 입력해야 검색돼요. (예: 김민)' : (all.length || q) ? '조건에 맞는 신청이 없어요. 검색어나 필터를 바꿔 보세요.' : '아직 접수된 신청이 없어요.';
      $('tbody').innerHTML = '<tr><td colspan="8" class="empty">' + msg + '</td></tr>';
      $('cards').innerHTML = '<div class="empty">' + msg + '</div>';
    } else {
      $('tbody').innerHTML = list.map(function (r) {
        return '<tr>' +
          '<td class="mono">' + esc(r.date) + '</td>' +
          '<td class="mono id">' + hl(r.id, q) + '</td>' +
          '<td>' + hl(r.name, q) + '</td>' +
          '<td>' + hl(r.org, q) + '</td>' +
          '<td>' + hl(r.email, q) + '</td>' +
          '<td class="mono">' + hl(r.phone, q) + '</td>' +
          '<td><span class="badge b-' + esc(r.status) + '">' + esc(r.status) + '</span></td>' +
          '<td class="msg">' + (r.message ? hl(r.message, q) : '<span style="color:#bbb">-</span>') + '</td>' +
          '</tr>';
      }).join('');
      $('cards').innerHTML = list.map(function (r) {
        return '<article class="item">' +
          '<div class="top"><div><div class="name">' + hl(r.name, q) + '</div><div class="org">' + hl(r.org, q) + '</div></div>' +
          '<span class="badge b-' + esc(r.status) + '">' + esc(r.status) + '</span></div>' +
          '<dl><dt>접수일시</dt><dd>' + esc(r.date) + '</dd>' +
          '<dt>휴대폰</dt><dd>' + hl(r.phone, q) + '</dd>' +
          '<dt>이메일</dt><dd>' + hl(r.email, q) + '</dd>' +
          '<dt>접수번호</dt><dd>' + hl(r.id, q) + '</dd></dl>' +
          (r.message ? '<div class="msg">' + hl(r.message, q) + '</div>' : '') +
          '</article>';
      }).join('');
    }
    renderPager(pages);
    document.querySelectorAll('th[data-sort]').forEach(function (th) {
      th.querySelector('.arrow').textContent = th.dataset.sort === sortKey ? (sortDir > 0 ? '▲' : '▼') : '';
    });
  }

  function renderPager(pages) {
    if (pages <= 1) { $('pager').innerHTML = ''; return; }
    var html = '<button data-p="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + '>‹</button>';
    for (var i = 1; i <= pages; i++) html += '<button data-p="' + i + '"' + (i === page ? ' class="on"' : '') + '>' + i + '</button>';
    html += '<button data-p="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + '>›</button>';
    $('pager').innerHTML = html;
  }

  // ---------- 도우미 ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hl(text, q) { // 검색어 강조 (XSS 안전하게 처리)
    var t = esc(text);
    if (!q) return t;
    var eq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return t.replace(new RegExp(eq, 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
  }

  // ---------- 이벤트 ----------
  var timer;
  $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(load, 400); });
  ['status', 'org', 'from', 'to', 'msgOnly'].forEach(function (id) { $(id).addEventListener('change', apply); });
  $('reset').addEventListener('click', function () {
    var hadQuery = $('q').value.trim() !== '';
    ['q', 'status', 'org', 'from', 'to', 'msgOnly'].forEach(function (id) { $(id).value = ''; });
    sortKey = 'date'; sortDir = -1;
    if (hadQuery) load(); else apply();
  });
  $('refresh').addEventListener('click', load);
  $('stats').addEventListener('click', function (e) {
    var b = e.target.closest('.stat'); if (!b) return;
    $('status').value = b.dataset.status; apply();
  });
  $('pager').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    page = +b.dataset.p; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      if (sortKey === th.dataset.sort) sortDir *= -1; else { sortKey = th.dataset.sort; sortDir = th.dataset.sort === 'date' ? -1 : 1; }
      apply();
    });
  });

  load();
</script>
</body>
</html>
